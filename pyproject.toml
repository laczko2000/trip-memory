[project]
name = "trip-memory"
version = "0.2.0"
description = "Turn a folder of holiday videos and photos into one memory video."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.0,<4",
    "pillow>=10.0",
    "pillow-heif>=0.18",
    "static-ffmpeg>=3.0",
]

[project.scripts]
trip-memory = "trip_memory.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
